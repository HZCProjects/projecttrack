<title>ProjectTrack - Quality Check Sheet - HZCProjects</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}
.header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.header a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:8px;margin-left:8px}.header a:hover{background:rgba(255,255,255,.22)}
.btn{background:#0f172a;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn-light{background:#fff;color:#0f172a;border:1px solid #e2e8f0}.btn-blue{background:#3b82f6;color:#fff}
.container{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px;margin-bottom:20px}
.card h2{font-size:16px;margin-bottom:4px}.card .sub{font-size:12px;color:#64748b;margin-bottom:16px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.meta-grid .f label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.meta-grid .f input{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.section{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;overflow:hidden}
.section-head{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.section-head h3{font-size:14px;font-weight:700}.section-head span{font-size:11px;background:#e2e8f0;padding:4px 8px;border-radius:20px}
.section-body{display:none;padding:0 16px 16px}.section.open .section-body{display:block}
.check-row{display:grid;grid-template-columns:40px 1fr 90px 90px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.check-row.header{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;background:#f8fafc;margin:0 -16px;padding:10px 16px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #e2e8f0}
.badge.pass{background:#dcfce7;color:#166534;border-color:#bbf7d0}.badge.fail{background:#fee2e2;color:#991b1b;border-color:#fecaca}.badge.na{background:#f1f5f9;color:#64748b}
.check-row input[type="text"]{width:100%;padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px}
.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px}
.sig{border:1px dashed #cbd5e1;border-radius:10px;padding:16px;text-align:center;min-height:100px}
.sig b{font-size:12px;display:block;margin-bottom:8px}
</style>
</head>

<div class="container">
<div class="card">
<h2>Quality Check Sheet - Powerline & Construction</h2><div class="sub">HZCProjects Self-Owned SaaS - Live: projecttrack-production-4ed6.up.railway.app</div>
<div class="meta-grid">
<div class="f"><label>Project Name</label><input id="proj" value="132kV Overhead Line - Lot 2"></div>
<div class="f"><label>Location / Chainage</label><input id="loc" value="Pole 12 - 18, Soweto Sector"></div>
<div class="f"><label>Date</label><input type="date" id="date"></div>
<div class="f"><label>Inspector</label><input id="ins" value="HZC QC Team"></div>
</div>
<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
<button class="btn btn-blue" onclick="window.print()">Print / Save PDF</button>
<button class="btn btn-light" onclick="exportQC()">Export JSON</button>
<button class="btn btn-light" onclick="clearAll()">Clear All</button>
<span id="score" style="margin-left:auto;font-size:13px;font-weight:700;color:#0f172a"></span>
</div>
</div>
<div id="sections"></div>
<div class="card">
<h2>Sign-off</h2>
<div class="sig-grid">
<div class="sig"><b>Site Engineer</b><div style="margin-top:20px"><input placeholder="Name & Signature" style="width:100%;border:none;border-bottom:1px solid #000;padding:6px;text-align:center"></div><small style="color:#94a3b8">Date: __/__/__</small></div>
<div class="sig"><b>QC Inspector</b><div style="margin-top:20px"><input placeholder="Name & Signature" style="width:100%;border:none;border-bottom:1px solid #000;padding:6px;text-align:center"></div><small style="color:#94a3b8">Date: __/__/__</small></div>
<div class="sig"><b>Client / Consultant</b><div style="margin-top:20px"><input placeholder="Name & Signature" style="width:100%;border:none;border-bottom:1px solid #000;padding:6px;text-align:center"></div><small style="color:#94a3b8">Date: __/__/__</small></div>
</div>
</div>
</div>
<script>
const data = [
{title:"1. Foundation & Excavation",items:["Excavation depth as per design (min 1.8m)","Foundation shuttering alignment & level","Reinforcement as per drawing","Concrete mix ratio & slump test","Curing period maintained (7 days)","Backfilling & compaction"]},
{title:"2. Pole Erection & Alignment",items:["Pole type & height verified (11m / 12m)","Pole verticality check (≤1° deviation)","Pole alignment with route survey","Foundation bolt tightening torque","Danger plate & numbering installed","Anti-climbing device fitted"]},
{title:"3. Conductor & Earth Stringing",items:["Conductor type (ACSR) verified","Sag & tension as per chart","Jumper connections tight & clean","Earth wire continuity","Insulator condition & cleaning","Clearance from buildings / trees (≥2.5m)"]},
{title:"4. Earthing & Lightning Protection",items:["Earth pit resistance <10 ohms","Earth electrode depth (3m min)","Earth conductor size (25x3mm GI)","Lightning arrester installed & tested","Bonding to all metallic parts","Earth pit marking & cover"]},
{title:"5. Transformer & Substation",items:["Transformer rating verified (100/200kVA)","Transformer oil level & BDV test","HT & LT bushing tightness","Cable termination & lugging","Protection - Fuse & MCB rating","Neutral earthing <5 ohms"]},
{title:"6. Testing & Commissioning",items:["Insulation resistance (Megger) >50MΩ","Continuity test for all phases","Polarity & phase sequence check","Load test & voltage measurement","Safety clearances verified","As-built drawing & photo documentation"]},
];
const storeKey='projecttrack_qc_v2';
let state = JSON.parse(localStorage.getItem(storeKey)||'{}');
function render(){
 const wrap=document.getElementById('sections'); wrap.innerHTML='';
 data.forEach((sec,si)=>{
   const div=document.createElement('div'); div.className='section '+(si===0?'open':'');
   const checks = sec.items.map((it,ii)=>{
     const key=`${si}_${ii}`; const val=state[key]||{status:'',remark:''};
     return `<div class="check-row"><div>${ii+1}</div><div>${it}</div><div><div class="badge ${val.status}" onclick="toggle('${key}')">${val.status||'Check'}</div></div><div style="font-size:11px;color:#64748b">${val.status==='pass'?'✓':val.status==='fail'?'✗':''}</div><div class="remark"><input placeholder="Remark" value="${val.remark||''}" oninput="setRemark('${key}',this.value)"></div></div>`
   }).join('');
   div.innerHTML=`<div class="section-head" onclick="this.parentElement.classList.toggle('open')"><h3>${sec.title}</h3><span>${sec.items.length} checks</span></div><div class="section-body"><div class="check-row header"><div>#</div><div>Checkpoint</div><div>Status</div><div></div><div>Remarks / Photo Ref</div></div>${checks}</div>`;
   wrap.appendChild(div);
 });
 updateScore();
}
function toggle(key){
 const cur=state[key]||{status:'',remark:''}; const order=['','pass','fail','na']; const next=order[(order.indexOf(cur.status)+1)%order.length];
 state[key]={...cur,status:next}; localStorage.setItem(storeKey,JSON.stringify(state)); render();
}
function setRemark(key,v){ state[key]={(state[key]||{}),remark:v,status:state[key]?.status||''}; localStorage.setItem(storeKey,JSON.stringify(state)); }
function updateScore(){
 const all=Object.values(state); const total=data.reduce((s,d)=>s+d.items.length,0); const checked=all.filter(a=>a.status).length; const pass=all.filter(a=>a.status==='pass').length; const fail=all.filter(a=>a.status==='fail').length;
 document.getElementById('score').innerText=`Checked ${checked}/${total} • Pass ${pass} • Fail ${fail} • Score ${total?Math.round(pass/Math.max(1,checked)*100):0}%`;
}
function exportQC(){
 const payload={project:document.getElementById('proj').value,location:document.getElementById('loc').value,date:document.getElementById('date').value,inspector:document.getElementById('ins').value,checks:state,exported:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`QC_${payload.project.replace(/\s+/g,'_')}.json`; a.click();
}
function clearAll(){ if(confirm('Clear all QC checks?')){ state={}; localStorage.removeItem(storeKey); render(); } }
document.getElementById('date').valueAsDate=new Date();
render();
</script>
