# fly.toml app configuration file generated for projecttrack on 2026-10-31T11:10:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "projecttrack"
primary_region = "jnb"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    h2_backend = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "projecttrack_data"
  destination = "/data"
  initial_size = "1GB"
