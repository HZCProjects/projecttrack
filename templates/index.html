<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/static/projecttrack.css"></head>
<body><div class="outer"><div class="inner" style="flex-direction:column;padding:30px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1 style="font-size:26px">HZC Projects - Dashboard <span id="dbBadge" class="badge">SQLITE</span></h1><span id="userInfo" style="font-size:12px"></span></div><p id="welcome" style="margin-top:16px;font-size:14px"></p><div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="width:auto;padding:10px 20px" onclick="location.href='/login.html'">Back to Accounts</button><button class="btn" style="width:auto;padding:10px 20px;background:#B2B2B2;color:#383C40" onclick="doLogout()">Logout</button></div><pre id="sys" style="margin-top:20px;background:#fff;padding:12px;border-radius:6px;font-size:11px;overflow:auto"></pre><div class="footer">www.projecttrack.co.za - STEP3 Both Postgres & SQLite</div></div></div>
<script>let t=localStorage.getItem('pt_token'),u=localStorage.getItem('pt_user');if(!t||!u)location.href='/login.html';let user=JSON.parse(u);document.getElementById('userInfo').textContent=user.email+' ('+user.role+')';document.getElementById('welcome').textContent='Logged as '+user.name+' - Role: '+user.role;fetch('/health').then(r=>r.json()).then(j=>{document.getElementById('sys').textContent=JSON.stringify(j,null,2);let b=document.getElementById('dbBadge');b.textContent=j.db_type;b.className='badge '+(j.db_type==='POSTGRES'?'postgres':'');});function doLogout(){fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+t}}).finally(()=>{localStorage.clear();location.href='/login.html';});}</script></body></html>
