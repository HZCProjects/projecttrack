<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProjectTrack - Login</title>
<link rel="stylesheet" href="/static/projecttrack.css">
<style>
body{background:#383C40;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.login-wrapper{width:340px;background:#B2B2B2;border:14px solid #383C40;padding:20px 26px 16px 26px}
.login-wrapper h1{font-size:36px !important;font-weight:900;text-align:center;margin:8px 0 18px 0;color:#000}
.label{color:#fff;font-size:13px;margin:14px 0 6px 0;font-weight:600}
.input-simple{background:#fff;border:1px solid #000;height:42px;display:flex;align-items:center}
.input-simple input{width:100%;border:none;outline:none;padding-left:14px;font-size:15px}
.input-wrap-simple{background:#fff;border:1px solid #000;height:42px;display:flex;align-items:center;position:relative}
.input-wrap-simple input{flex:1;border:none;outline:none;padding-left:14px;padding-right:42px;font-size:15px;height:100%}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;background:transparent;cursor:pointer;font-size:20px;display:flex !important;align-items:center;justify-content:center;z-index:10}
.check-row{display:flex;align-items:center;margin:14px 0;gap:8px;font-size:12px}
.check-row input{width:18px;height:18px;accent-color:#000}
.btn-signin{background:#383C40;color:#fff;width:100%;height:46px;border:none;font-weight:700;cursor:pointer;margin-top:8px;font-size:14px}
.links{text-align:center;margin-top:16px;font-size:12px;line-height:1.8}
.links a{color:#6B5BCE;text-decoration:none;font-weight:600}
.links .black{color:#000;font-weight:700}
</style>
</head>
<body>
<div class="login-wrapper">
<h1>Login</h1>
<div class="label">Email or Login Name</div>
<div class="input-simple"><input id="loginEmail" type="text" autocomplete="off"></div>
<div class="label">Password</div>
<div class="input-wrap-simple">
<input id="loginPass" type="password">
<button class="eye" id="eyeLogin" onclick="toggle('loginPass')">👁</button>
</div>
<div class="check-row"><input type="checkbox" id="keep" checked><label for="keep">Keep me signed in until I sign out</label></div>
<div class="check-row"><input type="checkbox" id="agreeLogin" checked><label for="agreeLogin">I agree to the <a href="#" style="color:#6B5BCE">Terms&Conditions</a></label></div>
<button class="btn-signin" onclick="doLogin()">SIGN IN</button>
<div class="links">
<div><a href="#">Forgot</a> <span class="black">Username / Password?</span></div>
<div><a href="#">Don't have an account?</a> <span class="black" style="cursor:pointer" onclick="window.location.href='/register'">Sign Up</span></div>
</div>
<div id="msg" style="color:red;font-size:12px;margin-top:10px;text-align:center"></div>
</div>
<script>
function toggle(id){
 let inp=document.getElementById(id);
 let btn=document.getElementById('eyeLogin');
 if(!inp) return;
 if(inp.type==='password'){inp.type='text';btn.innerHTML='◑';} else {inp.type='password';btn.innerHTML='👁';}
}
async function doLogin(){
 let email=document.getElementById('loginEmail').value.trim();
 let pwd=document.getElementById('loginPass').value;
 if(!email||!pwd){document.getElementById('msg').innerText='Enter email and password';return;}
 try{
  let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pwd})});
  let j=await r.json();
  if(!r.ok){document.getElementById('msg').innerText=j.error||'Login failed';return;}
  localStorage.setItem('pt_user',JSON.stringify(j));
  window.location.href='/static/index.html';
 }catch(e){document.getElementById('msg').innerText='Server error: '+e;}
}
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
