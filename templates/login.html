
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - ProjectTrack</title>
<style>
body{margin:0;background:#383C40;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Inter,Arial,sans-serif}
.card{width:346px;background:#B2B2B2;border-radius:14px;padding:24px 22px;box-sizing:border-box}
h1{font-size:36px;margin:0 0 18px 0;padding-left:14px;font-weight:800}
.label{font-weight:700;font-size:14px;margin:10px 0 6px 14px;display:block}
.input-wrap{position:relative;width:100%}
.input-wrap input{width:100%;height:44px;background:#fff;border:none;border-radius:6px;padding-left:14px;box-sizing:border-box;font-size:14px;outline:none}
.eye{position:absolute;top:0;bottom:0;margin:auto;right:12px;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.btn{width:100%;height:44px;background:#383C40;color:#fff;border:none;border-radius:6px;margin-top:18px;font-weight:700;cursor:pointer}
.black{color:#000;font-weight:700}
.links{margin-top:14px;text-align:center;font-size:14px;line-height:22px}
</style>
</head>
<body>
<div class="card">
<h1>Login To Account</h1>
<div><span class="label">Email or Login Name</span><div class="input-wrap"><input id="email" placeholder="Email or Login Name"></div></div>
<div><span class="label">Enter your password</span><div class="input-wrap"><input id="pwd" type="password" placeholder="Password"><span class="eye" onclick="toggle('pwd', this)">👁️</span></div></div>
<button class="btn" onclick="doLogin()">Enter To Login</button>
<div class="links">
<!-- FIXED: whole line clickable for Forgot -->
<div><a href="/forgot" style="text-decoration:none;color:#000;">Forgot Your Password? <span style="color:#5B4FB7;font-weight:700">Reset Here</span></a></div>
<!-- FIXED: whole line clickable for Sign Up -->
<div style="margin-top:6px"><a href="/register" style="text-decoration:none;color:#000;">Don't have an account? <span class="black">Sign Up</span></a></div>
<div style="margin-top:8px;font-weight:700">www.projecttrack.co.za</div>
</div>
</div>
<script>
function toggle(id, el){
  const i=document.getElementById(id);
  if(i.type==='password'){i.type='text'; el.textContent='🙈';}else{i.type='password'; el.textContent='👁️';}
}
async function doLogin(){
  const body={email:document.getElementById('email').value, password:document.getElementById('pwd').value};
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json(); if(j.ok) location.href='/dashboard'; else alert(j.error);
}
</script>
</body>
</html>
