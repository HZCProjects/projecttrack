<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HZC STEP2 GREEN</title><link rel="stylesheet" href="/static/projecttrack.css"></head>
<body><div class="header"><h1>HZC Projects - STEP2 GREEN</h1><span id="dbStatus">SQLite - Real DB</span></div><div class="wrap"><div class="card"><div class="tabs"><button class="tab active" data-tab="signin">Sign In</button><button class="tab" data-tab="create">Create Account</button><button class="tab" data-tab="users">Users DB</button></div>
<div id="signin" class="tab-content active"><label>Email</label><input id="loginEmail" type="email" placeholder="root@hzcprojects.com"><label>Password</label><input id="loginPass" type="password" placeholder="root123"><button class="btn" onclick="doLogin()">Sign In</button><div id="loginMsg" class="msg"></div><p style="margin-top:10px;font-size:11px;color:#888">Defaults: root@hzcprojects.com/root123 | admin@hzcprojects.com/admin123 | viewer@hzcprojects.com/viewer123</p></div>
<div id="create" class="tab-content"><label>Name</label><input id="regName" placeholder="Your Name"><label>Email</label><input id="regEmail" type="email"><label>Password</label><input id="regPass" type="password"><label>Role</label><select id="regRole"><option value="viewer">Viewer</option><option value="manager">Manager</option><option value="admin">Admin</option></select><button class="btn" onclick="doRegister()">Create Account</button><div id="regMsg" class="msg"></div></div>
<div id="users" class="tab-content"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="text-transform:uppercase;font-size:12px">Real Users from DB</h3><button class="btn btn-light" style="width:auto;padding:6px 12px;margin:0" onclick="loadUsers()">Refresh</button></div><table class="table" id="usersTable"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody></tbody></table><div id="usersMsg" class="msg"></div></div></div><div class="footer">STEP2 - SQLite - Hashed Passwords - Token 7 Days - HZC Only</div></div>
<script>
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');if(t.dataset.tab==='users')loadUsers();}));
function showMsg(id,txt,ok){let el=document.getElementById(id);el.textContent=txt;el.className='msg '+(ok?'ok':'err');}
fetch('/health').then(r=>r.json()).then(j=>document.getElementById('dbStatus').textContent='DB: '+j.db.toUpperCase()+' - Users: '+j.users);
async function doLogin(){let email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPass').value;let res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});let data=await res.json();if(!res.ok){showMsg('loginMsg',data.error,false);return;}localStorage.setItem('pt_token',data.token);localStorage.setItem('pt_user',JSON.stringify(data.user));showMsg('loginMsg','OK - redirect...',true);setTimeout(()=>location.href='/index.html',600);}
async function doRegister(){let name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim(),password=document.getElementById('regPass').value,role=document.getElementById('regRole').value;let res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role})});let d=await res.json();if(!res.ok){showMsg('regMsg',d.error,false);return;}showMsg('regMsg','Created ID '+d.user.id+' - Now sign in',true);loadUsers();}
async function loadUsers(){let tbody=document.querySelector('#usersTable tbody');tbody.innerHTML='<tr><td colspan=5>Loading...</td></tr>';let res=await fetch('/api/users');let users=await res.json();tbody.innerHTML='';users.forEach(u=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td><span style="color:#C62828;cursor:pointer" onclick="deleteUser(${u.id})">Delete</span></td>`;tbody.appendChild(tr);});}
async function deleteUser(id){if(!confirm('Delete '+id+'?'))return;let token=localStorage.getItem('pt_token');if(!token){alert('Login as admin first');return;}let res=await fetch('/api/users/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});let d=await res.json();if(!res.ok){document.getElementById('usersMsg').textContent=d.error;document.getElementById('usersMsg').className='msg err';return;}document.getElementById('usersMsg').textContent='Deleted';document.getElementById('usersMsg').className='msg ok';loadUsers();}
</script></body></html>
