<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HZC Projects - ProjectTrack</title><link rel="stylesheet" href="/static/projecttrack.css"></head>
<body>
<div class="outer">
<div class="inner">
<div class="left"><img src="/static/business-team.png" alt="Business Team"></div>
<div class="right" id="createView">
<h1>Create An Account</h1>
<div class="sub">Already have an account? <a onclick="showLogin()">Log In</a></div>
<div class="form">
<div class="row"><div class="field" style="flex:1"><input id="regName" placeholder="Name"></div><div class="field" style="flex:1"><input id="regSurname" placeholder="Surname"></div></div>
<div class="field"><input id="regEmail" type="text" placeholder="Email"></div>
<div class="field"><input id="regPass" type="password" placeholder="Enter your password (More than 6 characters)"><button class="eye" onclick="toggle('regPass')">👁</button></div>
<div class="field"><input id="regRepeat" type="password" placeholder="Repeat password"><button class="eye" onclick="toggle('regRepeat')">👁</button></div>
<div class="check"><input type="checkbox" id="agree1" checked><label for="agree1">I agree to the <a href="#">Terms&Conditions</a></label></div>
<button class="btn" id="createBtn" onclick="doRegister()">Create Account</button>
<div id="regMsg" class="msg"></div>
</div>
<div class="footer">www.projecttrack.co.za</div>
</div>

<div class="right" id="loginView" style="display:none">
<h1>Login To Account</h1>
<div class="sub">Don't have an account? <a onclick="showCreate()">Create One</a></div>
<div class="form">
<div class="field"><input id="loginEmail" type="text" placeholder="Email"></div>
<div class="field"><input id="loginPass" type="password" placeholder="Enter your password"><button class="eye" onclick="toggle('loginPass')">👁</button></div>
<div class="check"><input type="checkbox" id="agree2" checked><label for="agree2">I agree to the <a href="#">Terms&Conditions</a></label></div>
<button class="btn" onclick="doLogin()">Enter To Login</button>
<div id="loginMsg" class="msg"></div>
</div>
<div class="footer">www.projecttrack.co.za</div>
</div>

</div>
</div>

<script>
function toggle(id){let el=document.getElementById(id);el.type=el.type==='password'?'text':'password';}
function showLogin(){document.getElementById('createView').style.display='none';document.getElementById('loginView').style.display='flex';}
function showCreate(){document.getElementById('loginView').style.display='none';document.getElementById('createView').style.display='flex';}
function msg(id,txt,ok){let el=document.getElementById(id);el.textContent=txt;el.className='msg '+(ok?'ok':'err');el.style.display='block';}

async function doRegister(){
  let btn=document.getElementById('createBtn');
  btn.disabled=true; btn.textContent='Creating...';
  try{
   let name=document.getElementById('regName').value.trim();
   let surname=document.getElementById('regSurname').value.trim();
   let email=document.getElementById('regEmail').value.trim();
   let pwd=document.getElementById('regPass').value;
   let rep=document.getElementById('regRepeat').value;
   if(name.length<1){msg('regMsg','Name required',false); btn.disabled=false; btn.textContent='Create Account'; return;}
   if(email.length<6){msg('regMsg','Email must be >5 chars',false); btn.disabled=false; btn.textContent='Create Account'; return;}
   if(pwd.length<7){msg('regMsg','Password must be >6 chars',false); btn.disabled=false; btn.textContent='Create Account'; return;}
   if(pwd!==rep){msg('regMsg','Passwords do not match',false); btn.disabled=false; btn.textContent='Create Account'; return;}
   if(!document.getElementById('agree1').checked){msg('regMsg','Agree to Terms',false); btn.disabled=false; btn.textContent='Create Account'; return;}
   
   let res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,surname,email,password:pwd})});
   let data=await res.json();
   if(!res.ok){msg('regMsg',data.error,false); btn.disabled=false; btn.textContent='Create Account'; return;}
   msg('regMsg','Account created as '+data.user.role+' - Please Log In',true);
   setTimeout(()=>{document.getElementById('loginEmail').value=email; showLogin();},1200);
  }catch(e){
   msg('regMsg','Error: '+e.message,false);
  }finally{
   btn.disabled=false; btn.textContent='Create Account';
  }
}

async function doLogin(){
 try{
  let email=document.getElementById('loginEmail').value.trim();
  let pwd=document.getElementById('loginPass').value;
  let res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pwd})});
  let data=await res.json();
  if(!res.ok){msg('loginMsg',data.error,false);return;}
  localStorage.setItem('pt_token',data.token);
  localStorage.setItem('pt_user',JSON.stringify(data.user));
  msg('loginMsg','Welcome '+data.user.role+' - Redirecting...',true);
  setTimeout(()=>location.href='/index.html',800);
 }catch(e){msg('loginMsg','Error: '+e.message,false);}
}
</script>
</body></html>
