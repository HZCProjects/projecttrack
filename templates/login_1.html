<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#383C40; font-family:Arial; display:flex; justify-content:center; padding-top:60px;}
.card{width:346px; background:#B2B2B2; border-radius:8px; padding:24px; box-sizing:border-box;}
h2{font-size:36px; padding-left:14px; margin:0 0 16px 0; color:#000;}
.input-wrap{position:relative; width:100%; margin-bottom:12px;}
.input-wrap input{width:100%; height:44px; box-sizing:border-box; padding-left:14px; font-size:14px; border:none; border-radius:4px; background:white;}
.eye{position:absolute; top:0; bottom:0; margin:auto; right:12px; height:20px; cursor:pointer; display:flex; align-items:center;}
.btn{width:100%; height:44px; background:#000; color:#fff; border:none; border-radius:4px; font-size:14px; cursor:pointer;}
.black{color:#000; font-weight:bold;}
.msg{color:red; font-size:13px; padding-left:14px;}
a{color:#000;}
</style>
</head>
<body>
<div class="card">
<h2>Login</h2>
<div class="msg">{{msg}}</div>
<form method="post">
<div class="input-wrap"><input name="email" placeholder="Email" required></div>
<div class="input-wrap"><input id="pwd" name="password" type="password" placeholder="Password" required><span class="eye" onclick="togglePwd()"><span id="eyeIcon">👁️</span></span></div>
<button class="btn">Sign In</button>
</form>
<div style="margin-top:16px; text-align:center; font-size:14px; line-height:24px;">
<!-- FIXED: whole lines clickable -->
<div><a href="/forgot" style="text-decoration:none;">Forgot Your Password? <span style="color:#5B4FB7; font-weight:bold;">Reset Here</span></a></div>
<div><a href="/register" style="text-decoration:none;">Don't have an account? <span class="black">Sign Up</span></a></div>
</div>
</div>
<script>
let hidden=false;
function togglePwd(){
  const i=document.getElementById('pwd');
  const e=document.getElementById('eyeIcon');
  hidden=!hidden;
  i.type=hidden?'text':'password';
  e.textContent=hidden?'🙈':'👁️';
}
</script>
</body></html>
