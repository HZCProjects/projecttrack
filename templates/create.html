<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{margin:0;background:#383C40;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:20px 10px;}
.page{width:346px;}
.card{background:#B2B2B2;border-radius:2px;padding:22px 18px 16px 18px;box-sizing:border-box;border:1px solid #2E3236;}
h1{font-size:26px;text-align:center;margin:0 0 16px 0;font-weight:800;letter-spacing:-0.3px;}
label{font-size:11px;font-weight:700;display:block;margin:0 0 3px 2px;}
.input{position:relative;width:100%;height:38px;background:#fff;border:1px solid #8A8A8A;margin-bottom:12px;box-sizing:border-box;}
.input input{width:100%;height:100%;border:none;outline:none;padding:0 34px 0 10px;font-size:13px;box-sizing:border-box;background:#fff;}
.eye{position:absolute;top:0;bottom:0;margin:auto;right:8px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.check{display:flex;align-items:center;margin:8px 0;font-size:11px;}
.check input{margin:0 6px 0 0;width:14px;height:14px;accent-color:#000;}
.btn{width:100%;height:40px;background:#383C40;color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:0.5px;cursor:pointer;margin-top:8px;}
.links{margin-top:14px;text-align:center;font-size:11px;line-height:17px;}
.links a{text-decoration:none;color:#2E4A8A;}
.links .b{color:#000;font-weight:800;}
.msg{font-size:11px;color:#8B0000;text-align:center;min-height:12px;margin-bottom:4px;}
</style></head>
<body><div class="page"><div class="card">
<h1>Sign Up</h1>
<div class="msg">{{msg}}</div>
<form method="post">
<label>*Name</label><div class="input"><input name="name" required></div>
<label>*Surname</label><div class="input"><input name="surname" required></div>
<label>*Username / Email</label><div class="input"><input name="email" required></div>
<label>*Password</label><div class="input"><input id="p1" name="password" type="password" required><span class="eye" onclick="t1()" id="e1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span></div>
<label>*Repeat Password</label><div class="input"><input id="p2" name="repeat" type="password" required><span class="eye" onclick="t2()" id="e2"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span></div>
<div class="check"><input type="checkbox" required> I agree to the <a href="/terms">Terms&Conditions</a></div>
<button class="btn">SIGN UP</button>
</form>
<div class="links"><div><a href="/login" style="text-decoration:none;">Have an account? <span class="b">Sign In</span></a></div><div style="color:#2E4A8A;font-weight:700;">*All Fields Must Be Completed</div></div>
</div></div>
<script>let a=true,b=true;function t1(){const i=document.getElementById('p1'),e=document.getElementById('e1');a=!a;if(a){i.type='password';e.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`}else{i.type='text';e.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 2l22 22"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.53 9.53A10.07 10.07 0 0 0 2 12s4 8 11 8a10.07 10.07 0 0 0 7.94-3.06"/></svg>`}}function t2(){const i=document.getElementById('p2'),e=document.getElementById('e2');b=!b;if(b){i.type='password';e.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`}else{i.type='text';e.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="1.8"><path d="M1 2l22 22"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.53 9.53A10.07 10.07 0 0 0 2 12s4 8 11 8a10.07 10.07 0 0 0 7.94-3.06"/></svg>`}}</script>
</body></html>
