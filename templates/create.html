<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{margin:0;background:#383C40;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:20px 10px;}
.page{width:346px;}
.card{background:#B2B2B2;border-radius:2px;padding:22px 18px 16px 18px;box-sizing:border-box;border:1px solid #2E3236;}
h1{font-size:26px;text-align:center;margin:0 0 16px 0;font-weight:800;letter-spacing:-0.3px;}
label{font-size:11px;font-weight:700;display:block;margin:0 0 3px 2px;}
.input{position:relative;width:100%;height:38px;background:#fff;border:1px solid #8A8A8A;margin-bottom:12px;box-sizing:border-box;}
.input input{width:100%;height:100%;border:none;outline:none;padding:0 34px 0 10px;font-size:13px;box-sizing:border-box;background:#fff;}
.eye{position:absolute;top:0;bottom:0;margin:auto;right:8px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.check{display:flex;align-items:center;margin:8px 0;font-size:11px;}
.check input{margin:0 6px 0 0;width:14px;height:14px;accent-color:#000;}
.btn{width:100%;height:40px;background:#383C40;color:#fff;border:none;font-weight:700;font-size:13px;letter-spacing:0.5px;cursor:pointer;margin-top:8px;}
.links{margin-top:14px;text-align:center;font-size:11px;line-height:17px;}
.links a{text-decoration:none;color:#2E4A8A;}
.links .b{color:#000;font-weight:800;}
.msg{font-size:11px;color:#8B0000;text-align:center;min-height:12px;margin-bottom:4px;}
</style></head>
<body><div class="page"><div class="card">
<h1>Sign Up</h1>
<div class="msg">{{msg}}</div>
<form method="post" autocomplete="on">
<label>*Name</label><div class="input"><input name="name" type="text" autocomplete="given-name" required></div>
<label>*Surname</label><div class="input"><input name="surname" type="text" autocomplete="family-name" id="surname" required></div>
<label>*Username / Email</label><div class="input"><input name="email" type="text" autocomplete="username" required></div>
<label>*Password</label><div class="input"><input id="p1" name="password" type="password" autocomplete="new-password" required><span class="eye" onclick="var i=document.getElementById('p1'); i.type=i.type==='password'?'text':'password'">&#128065;</span></div>
<label>*Repeat Password</label><div class="input"><input id="p2" name="repeat" type="password" autocomplete="new-password" required><span class="eye" onclick="var i=document.getElementById('p2'); i.type=i.type==='password'?'text':'password'">&#128065;</span></div>
<div class="check"><input type="checkbox" required><span>I accept <a href="/terms">Terms&Conditions - ProjectTrack SaaS</a></span></div>
<button class="btn">SIGN UP</button>
<div class="links">Have an account? <a href="/login" class="b">Sign In</a><br><span>*All Fields Must Be Completed</span></div>
</form>
</div></div>
<script>
// Save last surname + password hint to localStorage for auto-fill, cleared by browser cache history
(function(){
  const surnameEl = document.getElementById('surname');
  const p1El = document.getElementById('p1');
  const p2El = document.getElementById('p2');
  // Load saved values if browser didn't auto-fill
  try {
    const savedSurname = localStorage.getItem('pt_last_surname');
    const savedPwd = localStorage.getItem('pt_last_password');
    if (savedSurname && !surnameEl.value) surnameEl.value = savedSurname;
    if (savedPwd && !p1El.value) { p1El.value = savedPwd; p2El.value = savedPwd; }
  } catch(e){}
  // Save on submit
  document.querySelector('form').addEventListener('submit', function(){
    try {
      if (surnameEl.value) localStorage.setItem('pt_last_surname', surnameEl.value);
      if (p1El.value) localStorage.setItem('pt_last_password', p1El.value);
    } catch(e){}
  });
})();
</script>
</body></html>
