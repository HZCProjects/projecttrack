<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wooden Pole Inspections - QC Sheet - ProjectTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}
.header{height:60px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-radius:12px;margin-bottom:20px;position:sticky;top:0;z-index:20}
.header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:13px;margin-left:8px}
.btn{border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn-dark{background:#0f172a;color:#fff}.btn-save{background:#10b981;color:#fff}.btn-light{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.container{max-width:1100px;margin:0 auto;padding:24px}
.main{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin:16px 0}
.f label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.f input,.f select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}

/* === TABLE FIT - CONVERTED TO GRID LIKE STEEL FOR A4 === */
.section-header-row{display:grid;grid-template-columns:40px 1fr 60px 60px 1fr;gap:8px;padding:8px 4px;background:#0f172a;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:6px;margin-bottom:4px;align-items:center}
.section-header-row div{text-align:center}
.section-header-row div:nth-child(2){text-align:left}
.check-row{display:grid;grid-template-columns:40px 1fr 60px 60px 1fr;gap:8px;align-items:center;justify-items:center;padding:10px 4px;border-bottom:1px solid #f1f5f9;font-size:13px}
.check-row div:nth-child(2){justify-self:start;text-align:left;width:100%}
.check{width:20px;height:20px;accent-color:#0f172a}
.pass-check{accent-color:#16a34a}
.fail-check{accent-color:#dc2626}
.check-row:has(.pass-check:checked){background:#f0fdf4}
.check-row:has(.fail-check:checked){background:#fef2f2}
.comment-input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.comment-input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}

/* RESPONSIVE SAME AS STEEL */
@media(max-width:1024px){
  .container{grid-template-columns:1fr!important;gap:12px;padding:12px!important}
  .meta-grid{grid-template-columns:1fr 1fr!important}
}
@media(max-width:768px){
  .header{flex-wrap:wrap;height:auto!important;padding:10px 12px!important;gap:8px;position:relative!important}
  .header div{width:100%;display:flex;flex-wrap:wrap;gap:6px}
  .header a{font-size:11px!important;padding:5px 8px!important}
  .container{padding:8px!important}
  .main{padding:14px!important}
  .meta-grid{grid-template-columns:1fr!important;gap:8px}
  .check-row{grid-template-columns:30px 1fr 50px 50px 1fr!important;font-size:12px!important;gap:6px}
  .section-header-row{grid-template-columns:30px 1fr 50px 50px 1fr!important;font-size:10px!important}
  .btn{font-size:11px!important;padding:8px 10px!important}
}
@media(max-width:480px){
  .check-row{grid-template-columns:24px 1fr 45px 45px 1fr!important}
}

/* === TRUE A4 BOTH FIT - EXACT COPY FROM STEEL QC === */
@page { size: A4 portrait; margin: 8mm; }
@page landscape { size: A4 landscape; margin: 8mm; }
@media print{
  body{background:#fff!important;margin:0!important;padding:0!important}
  .header{display:none!important}
  .no-print{display:none!important}
  .container{max-width:100%!important;padding:0!important;margin:0!important;width:100%!important}
  .main{box-shadow:none!important;border:none!important;padding:8px!important;border-radius:0!important}
  .meta-grid{grid-template-columns:1fr 1fr 1fr 1fr!important;gap:6px!important;margin:8px 0!important}
  .f input,.f select{padding:4px!important;font-size:8pt!important;border:1px solid #ccc!important}
  .f label{font-size:7pt!important;margin-bottom:2px!important}
  h2{font-size:12pt!important;margin-bottom:2px!important}
  .sub{font-size:8pt!important;margin-bottom:6px!important}
  .section-header-row{font-size:7pt!important;padding:4px!important;background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .check-row{font-size:8pt!important;padding:5px 2px!important;border-bottom:1px solid #ddd!important;page-break-inside:avoid}
  .comment-input{font-size:7pt!important;padding:3px!important;border:1px solid #ccc!important}
  .check{width:12px!important;height:12px!important}
  /* Force fit */
  .check-row, .section-header-row { max-width: 190mm; width: 100%; }
}
@media print and (orientation: landscape){
  @page { size: A4 landscape; margin: 8mm; }
  .check-row, .section-header-row { max-width: 277mm; }
}
</style>
</head>
<body>
<div class="header no-print">
<div><b>🪵 Wooden Pole Inspections</b> <span style="opacity:.6;font-size:12px">QC Sheet</span> <span id="roleBadge" style="background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:11px;margin-left:8px">Loading...</span></div>
<div>
<a href="./">🏠 Home</a>
<a href="./gantt">📅 Planner</a>
<a href="./qc">✅ All QC Sheets</a>
<a href="#" onclick="window.print()">🖨️ Print A4</a>
<a href="#" onclick="logout()" style="background:#ef4444">🚪 Logout</a>
</div>
</div>

<div class="container">
<div class="main">
<h2>Wooden Pole Inspections - Quality Check Sheet</h2>
<div class="sub">Overberg WEF - Wooden Pole Structures • A4 Both Fit - Same as Steel QC</div>

<div class="meta-grid">
<div class="f"><label>Project Name</label><input id="project" value="Overberg WEF"></div>
<div class="f"><label>Contractor</label><input id="contractor" placeholder="2671 / Contractor Name"></div>
<div class="f"><label>Date</label><input id="date" type="date"></div>
<div class="f"><label>Inspector</label><input id="inspector" placeholder="Inspector Name"></div>
</div>

<div class="meta-grid">
<div class="f"><label>Structure No</label><input id="structure" placeholder="e.g. 246 / 296"></div>
<div class="f"><label>Collector No</label><input id="collector" placeholder="e.g. 420"></div>
<div class="f"><label>Section No</label><input id="section" placeholder="e.g. 421"></div>
<div class="f"><label>Depth / Height</label><select id="depth"><option>2.0m</option><option selected>2.5m</option><option>3.0m</option></select></div>
</div>

<div class="section-header-row"><div>#</div><div>Inspection Requirement</div><div>Pass</div><div>Fail</div><div>Comment</div></div>
<div id="rows"></div>

<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap" class="no-print">
<button class="btn btn-dark" onclick="saveSheet()">💾 Save to ProjectTrack</button>
<button class="btn btn-light" onclick="clearAll()">Clear</button>
<button class="btn btn-light" onclick="window.print()">🖨️ Print A4 Both Fit</button>
<span id="status" style="font-size:12px;color:#64748b;padding:10px"></span>
</div>
</div>
</div>

<script>
const items=[
"Pole(s) installed at the correct location and orientation",
"Structure is straight, level and vertically plumb",
"H-pole bisectors are correctly aligned and in line",
"Bill (pole top) has been cut to the specified requirement",
"PVC pipe installed and at the correct specified height (2.5m) above ground level",
"Bonding clips correctly fitted and securely tightened",
"Bonding is continuous with no damage or loose connections",
"All bolts and nuts installed correctly and are straight",
"All eye bolts are correctly installed and plumb",
"Stay wire pole top is installed 100 mm from the bottom of the BILL, cut and tied as per specification",
"All lock nuts checked and fully tightened",
"Washers correctly installed where required",
"Cross-arms and fittings securely installed"
];
function renderRows(){
  const c=document.getElementById('rows');
  c.innerHTML=items.map((t,i)=>{
    const n=i+1;
    return `<div class="check-row" id="row-${n}"><div><b>${n}</b></div><div>${t}</div><div><input type="checkbox" class="check pass-check" data-row="${n}" onchange="setPass(${n})"></div><div><input type="checkbox" class="check fail-check" data-row="${n}" onchange="setFail(${n})"></div><div><input class="comment-input" id="comment-${n}" placeholder="Comment..."></div></div>`;
  }).join('');
}
function getUser(){try{return JSON.parse(localStorage.getItem('projecttrack_user')||'null')}catch{return null}}
function authHeader(){const u=getUser(); return u&&u.token?{'Authorization':'Bearer '+u.token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
function guard(){const u=getUser(); if(!u||!u.token){window.location.href='./login'; return null;} const rb=document.getElementById('roleBadge'); if(rb) rb.innerText=(u.display_name||u.username)+' ('+u.role+')'; return u;}
function logout(){const u=getUser(); if(u&&u.token) fetch('./api/auth/logout',{method:'POST',headers:authHeader()}); localStorage.removeItem('projecttrack_user'); window.location.href='./login';}
const me=guard();
function setPass(i){
  const p=document.querySelector(`.pass-check[data-row="${i}"]`);
  const f=document.querySelector(`.fail-check[data-row="${i}"]`);
  if(p.checked) f.checked=false;
  const tr=document.getElementById(`row-${i}`); tr.style.background=p.checked?'#f0fdf4':'';
}
function setFail(i){
  const p=document.querySelector(`.pass-check[data-row="${i}"]`);
  const f=document.querySelector(`.fail-check[data-row="${i}"]`);
  if(f.checked) p.checked=false;
  const tr=document.getElementById(`row-${i}`); tr.style.background=f.checked?'#fef2f2':'';
}
function clearAll(){
  if(!confirm('Clear all checks?')) return;
  document.querySelectorAll('.check').forEach(c=>c.checked=false);
  document.querySelectorAll('.check-row').forEach(tr=>tr.style.background='');
  document.querySelectorAll('.comment-input').forEach(c=>c.value='');
}
async function saveSheet(){
  const u=getUser();
  if(u&&u.role==='viewer'){ alert('Viewer cannot save. Contact admin.'); return; }
  const checklist={};
  for(let i=1;i<=13;i++){
    const p=document.querySelector(`.pass-check[data-row="${i}"]`).checked;
    const f=document.querySelector(`.fail-check[data-row="${i}"]`).checked;
    const c=document.getElementById(`comment-${i}`).value;
    checklist[i]={item: items[i-1], pass:p, fail:f, comment:c};
  }
  const payload={
    project_name: document.getElementById('project').value,
    location: document.getElementById('contractor').value,
    structure_number: document.getElementById('structure').value,
    collector_number: document.getElementById('collector').value,
    section_number: document.getElementById('section').value,
    chainage_extra: document.getElementById('depth').value,
    date: document.getElementById('date').value,
    inspector: document.getElementById('inspector').value,
    status: 'submitted',
    sheet_type: 'wooden_pole',
    checklist_data: checklist
  };
  document.getElementById('status').innerText='Saving...';
  try{
    const r=await fetch('./api/qc-sheets',{method:'POST',headers:authHeader(),body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok){ document.getElementById('status').innerText='❌ '+d.error; return; }
    document.getElementById('status').innerText='✅ Saved ID '+d.id;
  }catch(e){ document.getElementById('status').innerText='Error '+e.message; }
}
renderRows();
document.getElementById('date').valueAsDate=new Date();
</script>
</body>
</html>
