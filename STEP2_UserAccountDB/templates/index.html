<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard STEP2</title><link rel="stylesheet" href="/static/projecttrack.css"></head>
<body><div class="header"><h1>HZC Projects - Dashboard</h1><span id="userInfo">Checking...</span></div><div class="wrap"><div class="card" style="padding:24px"><h2 style="text-transform:uppercase;font-size:14px">Welcome - STEP2 User DB Works</h2><p id="welcome" style="margin-top:10px;font-size:13px"></p><div style="margin-top:16px;display:flex;gap:8px"><button class="btn" style="width:auto;padding:8px 14px" onclick="location.href='/login.html'">Users DB</button><button class="btn btn-light" style="width:auto;padding:8px 14px" onclick="doLogout()">Logout</button></div><div id="sys" style="margin-top:14px;font-size:12px;background:#F4F4F5;padding:10px;border-radius:6px"></div></div><div class="footer">STEP2 - SQLite - HZC Projects</div></div>
<script>let t=localStorage.getItem('pt_token'),u=localStorage.getItem('pt_user');if(!t||!u)location.href='/login.html';let user=JSON.parse(u);document.getElementById('userInfo').textContent=user.email+' ('+user.role+')';document.getElementById('welcome').textContent='Logged as '+user.name+' - Role: '+user.role;fetch('/health').then(r=>r.json()).then(j=>document.getElementById('sys').textContent=JSON.stringify(j,null,2));function doLogout(){fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+t}}).finally(()=>{localStorage.clear();location.href='/login.html';});}</script></body></html>
