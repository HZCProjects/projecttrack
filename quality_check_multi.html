<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectTrack - Steel Monopoles QC - HZCProjects</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}
.header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:13px;margin-left:8px}
.btn{border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn-blue{background:#3b82f6;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-light{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.container{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:20px}
.sidebar-list{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:16px;height:fit-content;position:sticky;top:84px}
.sheet-item{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid #f1f5f9;margin-bottom:8px}
.sheet-item:hover{background:#f8fafc}.sheet-item.active{background:#eff6ff;border-color:#bfdbfe}
.sheet-item b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-item small{font-size:11px;color:#64748b}
.main{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}
.f label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.f input,.f select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.section{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;overflow:hidden}
.section-head{background:#f8fafc;padding:10px 14px;display:flex;justify-content:space-between;cursor:pointer}
.section-head h4{font-size:13px}.section-body{display:none;padding:0 14px 14px}.section.open .section-body{display:block}
.check-row{display:grid;grid-template-columns:30px 1fr 80px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #e2e8f0}
.badge.pass{background:#dcfce7;color:#166534}.badge.fail{background:#fee2e2;color:#991b1b}.badge.na{background:#f1f5f9}
.back-btn{color:#fff;text-decoration:none;background:#475569;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px;display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.2)}
/* RESPONSIVE - TABLETS & PHONES */
@media(max-width:1024px){
  .container{grid-template-columns:250px 1fr !important;gap:12px;padding:12px !important}
  .meta-grid{grid-template-columns:1fr 1fr !important}
}
@media(max-width:768px){
  .header{flex-wrap:wrap;height:auto !important;padding:10px 12px !important;gap:8px;position:relative !important}
  .header div{width:100%;display:flex;flex-wrap:wrap;gap:6px}
  .header a, .back-btn{font-size:11px !important;padding:5px 8px !important}
  .container{grid-template-columns:1fr !important;padding:8px !important;gap:12px}
  .sidebar-list{position:relative !important;top:0 !important;order:2}
  .main{order:1;padding:14px !important}
  .meta-grid{grid-template-columns:1fr !important;gap:8px}
  .check-row{grid-template-columns:30px 1fr 70px 1fr !important;font-size:12px !important;gap:6px}
  .check-row div:nth-child(4) input{font-size:11px !important;padding:6px !important}
  .section-head h4{font-size:12px !important}
  .btn{font-size:11px !important;padding:8px 10px !important}
  #score{font-size:12px !important;line-height:1.5}
}
@media(max-width:480px){
  .header b{font-size:14px}
  .main h2{font-size:16px !important}
  .f label{font-size:10px !important}
  .f input, .f select{font-size:12px !important;padding:8px !important}
  .check-row{grid-template-columns:24px 1fr 60px 1fr !important}
  .badge{font-size:10px !important;padding:3px 6px !important}
  div[style*="display:flex;gap:8px"]{flex-wrap:wrap !important}
}

/* HAMBURGER MENU FOR PHONES/TABLETS */
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:6px 8px;background:rgba(255,255,255,.15);border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.hamburger span{width:18px;height:2px;background:#fff;border-radius:2px;display:block}
.nav-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media(max-width:768px){
  .hamburger{display:flex !important}
  .nav-links{display:none !important;flex-direction:column;position:absolute;top:100%;right:0;left:0;background:#0f172a;padding:12px;border-radius:0 0 12px 12px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .nav-links.open{display:flex !important}
  .nav-links a, .nav-links button{width:100%;justify-content:flex-start !important;margin:2px 0 !important}
  .header{position:relative !important;flex-wrap:wrap}
  .header-title{width:100%;display:flex;justify-content:space-between;align-items:center}
}

</style>
</head>
<body>
<div class="header">
<div class="header-title" style="display:flex;justify-content:space-between;align-items:center;width:100%"><div><b>🏗️ Steel Monopoles QC</b> <span style="opacity:.6;font-size:12px">Overberg WEF</span> <span id="roleBadge" style="background:rgba(255,255,255,.15);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;margin-left:8px">Loading...</span></div><div class="hamburger" onclick="toggleNav()" id="hamburgerBtn"><span></span><span></span><span></span></div></div>
<div class="nav-links" id="navLinks"><a href="#" onclick="goBack()" class="back-btn">← Previous</a><a href="/">🏠 Home</a><a href="/gantt">📅 Planner</a><a href="/quality">🏗️ Quality</a><a href="#" onclick="logout()" style="background:#ef4444">🚪 Logout</a></div>
</div>
<div class="container">
<div class="sidebar-list">
<h3>Steel Monopoles Sheets</h3>
<button class="btn btn-blue" style="width:100%;margin-bottom:12px" onclick="createNew()">+ New Steel Monopole</button>
<div id="list"></div>
</div>
<div class="main">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<h2 id="sheetTitle">Select or Create a Sheet</h2>
<div style="display:flex;gap:8px"><button class="btn btn-light" onclick="saveCurrent()">💾 Save to DB</button><button class="btn btn-light" onclick="duplicateSheet()">Duplicate</button><button class="btn btn-light" onclick="deleteSheet()" style="color:#ef4444">Delete</button></div>
</div>
<div class="meta-grid">
<div class="f"><label>Project Name</label><input id="proj" placeholder="Overberg WEF"></div>
<div class="f"><label>Contractor</label><select id="contractor"><option value="AKC" selected>AKC</option><option value="SST">SST</option></select></div>
<div class="f"><label>Location / Structure No</label><input id="loc" placeholder="Pole 100"></div>
<div class="f"><label>GPS Coordinates</label><input id="gps" placeholder="e.g. -34.1234, 19.4567"><button onclick="getSteelGPS()" style="margin-top:4px;font-size:11px;padding:6px 8px;border:none;background:#3b82f6;color:#fff;border-radius:6px;cursor:pointer;width:100%">📍 Get Current GPS</button></div>
<div class="f"><label>Date of Inspection</label><input type="date" id="date"></div>
<div class="f"><label>Inspected By:</label><input id="ins" placeholder="Name"></div>
<div class="f"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="in_progress">In Progress</option><option value="passed">Passed</option><option value="failed">Failed</option></select></div>
</div>
<div id="score" style="font-size:14.4px;font-weight:700;margin:12px 0"></div>
<div id="msg" style="font-size:13px;margin:8px 0;min-height:20px"></div>
<div id="sections"></div>
<div style="margin-top:20px;display:flex;gap:10px"><button class="btn btn-dark" onclick="saveCurrent()">Save to Database</button><button class="btn btn-light" onclick="window.print()">🖨️ Print</button><button class="btn" style="background:#dc2626;color:#fff" onclick="exportSteelPDF()">📄 Export to PDF</button></div>
</div>
</div>
<script>
const checksData = [
{title:"1. Foundation & Anchor Bolts",items:["Foundation excavation 3.0m depth check","Anchor bolt cage alignment & template","Bolt projection 150mm above foundation","Concrete strength C30/37 & slump test","Curing 7 days & backfill compaction","Foundation level ±5mm tolerance"]},
{title:"2. Monopole Shaft Sections",items:["Steel grade S355JR verification","Shaft section straightness <1/1000","Galvanizing thickness 85μm min","Welds visual + UT NDT","Section length & diameter check","Corrosion protection / paint"]},
{title:"3. Flange Bolting & Assembly",items:["Flange bolt grade 10.9 verification","Torque 650Nm sequence star pattern","Bolt tension & gap 0-2mm","Verticality ≤0.5° check","Section alignment & overlap 1.5x dia","Danger plate & anti-climb installed"]},
{title:"4. Earthing & Lightning",items:["Earth resistance <10Ω","Earthing electrode 3m depth","GI earth strip 40x4mm continuous","Lightning finial height 2m above top","Bonding to monopole shaft","Earth pit marking & cover"]},
{title:"5. Cross-arms & Hardware",items:["Cross-arm bracket alignment","Insulator type & creepage distance","Conductor attachment hardware","Vibration dampers installed","Jumper clearance ≥2.5m","Hardware torque & cotter pins"]},
{title:"6. Final Inspection & Testing",items:["IR test >50MΩ","Structure ID & height marking","Safety clearance 8m min","As-built drawing & photos","Punch list cleared","Client handover sign-off"]},
];
let currentId = null;
let currentChecks = {};
function getUser(){try{return JSON.parse(localStorage.getItem('projecttrack_user')||'null')}catch{return null}}
function guardSimple(){const u=getUser();if(!u||!u.token){window.location.href='/login';return null;}const rb=document.getElementById('roleBadge');if(rb){rb.innerText=(u.display_name||u.username)+' ('+u.role+')';}return u;}
function authHeader(){const u=getUser();return u&&u.token?{'Authorization':'Bearer '+u.token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};}
function goBack(){if(document.referrer&&document.referrer.includes(window.location.host)){history.back();}else{window.location.href='/';}}
function logout(){const u=getUser();if(u&&u.token)fetch('/api/auth/logout',{method:'POST',headers:authHeader()});localStorage.removeItem('projecttrack_user');window.location.href='/login';}
guardSimple();
async function api(path, method='GET', body=null){
  const opts={method, headers:authHeader()};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path, opts);
  const text=await r.text();
  try{ return JSON.parse(text); }catch{ throw new Error('Session expired or API error. Please login again. Server: '+text.slice(0,200)); }
}
async function loadList(){
  try{
    const sheets = await api('/api/qc-sheets');
    // STRICTLY separate - ONLY steel_monopole sheets, NOT wooden
    const filtered = sheets.filter(s=> s.sheet_type==='steel_monopole' );
    // Fallback: if no steel_monopole yet (old data), try public list
    let finalList = filtered;
    if(finalList.length===0){
      try{
        const r=await fetch('/api/qc-sheets/steel-list');
        const steelOnly=await r.json();
        if(Array.isArray(steelOnly) && steelOnly.length>0) finalList=steelOnly;
      }catch{}
    }
    const el=document.getElementById('list'); el.innerHTML='';
    // Show count badge
    const badge=document.getElementById('steelCount');
    if(badge) badge.innerText=finalList.length+' Steel Monopoles';
    finalList.forEach(s=>{
      const div=document.createElement('div'); div.className='sheet-item'+(s.id===currentId?' active':'');
      div.innerHTML=`<b>${s.project_name||'No Project'} - ${s.location||''}</b><small>${s.date||''} • ${s.status||'draft'} • ID ${s.id}</small>`;
      div.onclick=()=>openSheet(s.id); el.appendChild(div);
    });
  }catch(e){ document.getElementById('msg').innerText='Error loading list: '+e.message; }
}
async function openSheet(id){
  try{
    const s = await api(`/api/qc-sheets/${id}`);
    currentId=id; 
    currentChecks=s.checks||s.checklist_data||{};
    if(typeof currentChecks==='string'){ try{ currentChecks=JSON.parse(currentChecks);}catch{ currentChecks={}; } }
    document.getElementById('proj').value=s.project_name||''; 
    if(document.getElementById('contractor')) document.getElementById('contractor').value=s.contractor||s.location||'AKC'; 
    document.getElementById('loc').value=s.location||'';
    document.getElementById('gps').value=s.chainage_extra||'';
    document.getElementById('date').value=s.date||''; 
    document.getElementById('ins').value=s.inspector||'';
    document.getElementById('status').value=s.status||'draft'; 
    document.getElementById('sheetTitle').innerText=`${s.project_name||''} - ${s.location||''} (ID ${s.id})`;
    renderChecks();
    loadList();
  }catch(e){ alert('Error opening sheet: '+e.message); }
}
function renderChecks(){
  const wrap=document.getElementById('sections'); wrap.innerHTML='';
  let total=0, pass=0, fail=0, checked=0;
  checksData.forEach((sec,si)=>{
    const div=document.createElement('div'); div.className='section '+(si===0?'open':'');
    let rows='';
    sec.items.forEach((it,ii)=>{
      const key=`${si}_${ii}`; const val=currentChecks[key]||{status:'',remark:''};
      total++; if(val.status){checked++; if(val.status==='pass')pass++; if(val.status==='fail')fail++;}
      rows+=`<div class="check-row"><div>${ii+1}</div><div>${it}</div><div><div class="badge ${val.status}" onclick="toggleCheck('${key}')">${val.status||'Check'}</div></div><div><input placeholder="Remark" value="${val.remark||''}" oninput="setRemark('${key}',this.value)"></div></div>`;
    });
    div.innerHTML=`<div class="section-head" onclick="this.parentElement.classList.toggle('open')"><h4>${sec.title}</h4><span>${sec.items.length}</span></div><div class="section-body">${rows}</div>`;
    wrap.appendChild(div);
  });
  const progress = total ? Math.round(checked/total*100) : 0;
  const unchecked = total - checked;
  const failColor = fail>0 ? '#ef4444' : '#64748b';
  const failWeight = fail>0 ? '800' : '400';
  const failBg = fail>0 ? '#fee2e2' : 'transparent';
  const failBorder = fail>0 ? '1px solid #fecaca' : '1px solid transparent';
  const passColor = pass>0 ? '#16a34a' : '#64748b';
  const passWeight = pass>0 ? '800' : '400';
  const passBg = pass>0 ? '#dcfce7' : 'transparent';
  const passBorder = pass>0 ? '1px solid #bbf7d0' : '1px solid transparent';
  const scoreEl = document.getElementById('score');
  if(scoreEl) scoreEl.innerHTML=`Checked ${checked}/${total} (${progress}%) • Pass <span style="color:${passColor};font-weight:${passWeight};background:${passBg};padding:2px 8px;border-radius:6px;border:${passBorder}">${pass}</span> • Fail <span style="color:${failColor};font-weight:${failWeight};background:${failBg};padding:2px 8px;border-radius:6px;border:${failBorder}">${fail}</span> • Uncheck ${unchecked}`;
}
function toggleCheck(key){
  const cur=currentChecks[key]||{status:'',remark:''}; const order=['','pass','fail','na']; const next=order[(order.indexOf(cur.status)+1)%order.length];
  currentChecks[key]={...cur,status:next}; renderChecks();
}
function setRemark(key,v){ currentChecks[key]={...(currentChecks[key]||{}), remark:v, status:currentChecks[key]?.status||''}; }
async function createNew(){
  const proj=prompt('Project Name?', 'Overberg WEF')||'Overberg WEF';
  const loc=prompt('Structure No / Location?', 'Pole Number 100, Section 4')||'SM-12';
  try{
    const s=await api('/api/qc-sheets','POST',{project_name:proj, location:loc, date:new Date().toISOString().slice(0,10), inspector:'HZC QC Team', status:'draft', sheet_type:'steel_monopole', checklist_data:{}, chainage_extra:''});
    await loadList(); await openSheet(s.id);
  }catch(e){ alert('Create failed: '+e.message); }
}
async function saveCurrent(){
  if(!currentId){ alert('Create a sheet first - click + New Steel Monopole'); return; }
  const btn=document.getElementById('msg'); btn.innerText='Saving...';
  const payload={
    project_name:document.getElementById('proj').value,
    location:document.getElementById('loc').value,
    chainage_extra:document.getElementById('gps').value,
    date:document.getElementById('date').value,
    inspector:document.getElementById('ins').value,
    status:document.getElementById('status').value,
    sheet_type:'steel_monopole',
    checklist_data:currentChecks
  };
  try{
    // Try normal authenticated save
    await api(`/api/qc-sheets/${currentId}`,'PUT',payload);
    btn.innerText='✅ Saved to database ID '+currentId+' at '+new Date().toLocaleTimeString();
    btn.style.color='#16a34a';
    setTimeout(()=>{ btn.innerText=''; }, 4000);
    loadList();
  }catch(e){
    console.error('Auth save failed, trying public fallback:', e);
    try{
      // Fallback: try public endpoint (works even if session expired)
      const r=await fetch(`/api/qc-sheets/public-update/${currentId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json();
      if(r.ok){
        btn.innerText='✅ Saved (public fallback) ID '+currentId+' at '+new Date().toLocaleTimeString()+' - Please restore Postgres';
        btn.style.color='#f59e0b';
        setTimeout(()=>{ btn.innerText=''; }, 6000);
        loadList();
        return;
      }else{
        throw new Error(d.error||'Public save failed');
      }
    }catch(e2){
      btn.innerText='❌ Save failed: '+e2.message;
      btn.style.color='#dc2626';
      console.error(e2);
      if(e2.message.includes('Session expired')||e2.message.includes('Unauthorized')||e.message.includes('Session expired')){
        // Don't redirect to login immediately - show error and allow retry
        btn.innerText='❌ Session expired - Trying to save anyway...';
        setTimeout(()=>{ btn.innerText='Please login again at /login if it still fails'; }, 2000);
      }
    }
  }
}
async function duplicateSheet(){
  if(!currentId) return;
  const btn=document.getElementById('msg');
  try{
    // Try get via auth, fallback to public get
    let s;
    try{
      s=await api(`/api/qc-sheets/${currentId}`);
    }catch(e){
      console.log('Auth get failed, trying public get');
      const r=await fetch(`/api/qc-sheets/public-get/${currentId}`);
      if(r.ok){ s=await r.json(); } else { throw e; }
    }
    const payload={project_name:s.project_name, location:(s.location||'')+' (Copy)', date:s.date, inspector:s.inspector, status:'draft', checklist_data:s.checks||s.checklist_data||s.checklist_data, chainage_extra:s.chainage_extra, sheet_type:'steel_monopole'};
    let ns;
    try{
      ns=await api('/api/qc-sheets','POST',payload);
    }catch(e){
      console.log('Auth create failed, trying public save');
      const r=await fetch('/api/qc-sheets/public-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      ns=await r.json();
      if(!r.ok) throw new Error(ns.error||'Duplicate failed');
    }
    btn.innerText='✅ Duplicated to ID '+ns.id;
    btn.style.color='#16a34a';
    loadList(); openSheet(ns.id);
  }catch(e){ 
    btn.innerText='❌ Duplicate failed: '+e.message;
    btn.style.color='#dc2626';
    console.error(e);
    alert('Duplicate failed: '+e.message+' - Try public fallback'); 
  }
}
async function deleteSheet(){
  if(!currentId) return;
  if(!confirm('Delete sheet ID '+currentId+'?')) return;
  try{
    await api(`/api/qc-sheets/${currentId}`,'DELETE'); 
  }catch(e){
    console.log('Auth delete failed, trying public delete');
    try{
      const r=await fetch(`/api/qc-sheets/public-delete/${currentId}`,{method:'DELETE'});
      if(!r.ok){ throw e; }
    }catch(e2){ 
      alert('Delete failed: '+e2.message); 
      return;
    }
  }
  currentId=null; document.getElementById('sections').innerHTML=''; document.getElementById('sheetTitle').innerText='Select or Create a Sheet'; loadList();
}

function toggleNav(){ const nav=document.getElementById('navLinks'); if(nav) nav.classList.toggle('open'); }
// Close nav when clicking outside
document.addEventListener('click', e=>{
  const nav=document.getElementById('navLinks');
  const ham=document.getElementById('hamburgerBtn');
  if(nav && ham && !nav.contains(e.target) && !ham.contains(e.target) && nav.classList.contains('open')) nav.classList.remove('open');
});

function getSteelGPS(){
  const btn = document.querySelector('button[onclick="getSteelGPS()"]');
  if(!navigator.geolocation){ alert('GPS not supported'); return; }
  if(btn) btn.innerText='📍 Getting GPS...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
    const el=document.getElementById('gps'); if(el) el.value=coords;
    if(btn) btn.innerText='✅ GPS Captured';
    setTimeout(()=>{ if(btn) btn.innerText='📍 Get Current GPS'; }, 2500);
  }, err=>{
    alert('GPS Error: '+err.message);
    if(btn) btn.innerText='📍 Get Current GPS';
  }, {enableHighAccuracy:true, timeout:15000});
}
function exportSteelPDF(){ alert('PDF Export: Use browser Print → Save as PDF'); window.print(); }
loadList();
document.getElementById('date').valueAsDate=new Date();
</script>
</body>
</html>
