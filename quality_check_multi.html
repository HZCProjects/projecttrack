<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectTrack - QC Multi Sheets - HZCProjects</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}
.header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:13px;margin-left:8px}
.btn{border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn-blue{background:#3b82f6;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-light{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.container{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:20px}
.sidebar-list{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:16px;height:fit-content;position:sticky;top:84px}
.sidebar-list h3{font-size:14px;margin-bottom:12px}
.sheet-item{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid #f1f5f9;margin-bottom:8px}
.sheet-item:hover{background:#f8fafc}.sheet-item.active{background:#eff6ff;border-color:#bfdbfe}
.sheet-item b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-item small{font-size:11px;color:#64748b}
.main{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.f label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.f input,.f select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.section{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;overflow:hidden}
.section-head{background:#f8fafc;padding:10px 14px;display:flex;justify-content:space-between;cursor:pointer}
.section-head h4{font-size:13px}.section-body{display:none;padding:0 14px 14px}.section.open .section-body{display:block}
.check-row{display:grid;grid-template-columns:30px 1fr 80px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #e2e8f0}
.badge.pass{background:#dcfce7;color:#166534}.badge.fail{background:#fee2e2;color:#991b1b}.badge.na{background:#f1f5f9}
@media(max-width:900px){.container{grid-template-columns:1fr}.sidebar-list{position:static}}
</style>

<script>
function getUser(){try{return JSON.parse(localStorage.getItem('projecttrack_user')||'null')}catch{return null}}
function guardSimple(){
  const u=getUser();
  if(!u || !u.token){ window.location.href='./login'; return null; }
  // Don't call /api/auth/me on page load - token is persistent now in DB, so no need to verify every load
  const rb=document.getElementById('roleBadge'); if(rb){ rb.innerText=(u.display_name||u.username)+' ('+u.role+')'; rb.className='badge '+u.role; }
  return u;
}
function authHeader(){
  const u=getUser();
  return u && u.token ? {'Authorization':'Bearer '+u.token,'Content-Type':'application/json'} : {'Content-Type':'application/json'};
}
function logout(){
  const u=getUser();
  if(u && u.token){ fetch('./api/auth/logout',{method:'POST',headers:authHeader()}); }
  localStorage.removeItem('projecttrack_user'); window.location.href='./login';
}
document.addEventListener('DOMContentLoaded', guardSimple);
// Patch fetch to add token automatically
const _f=window.fetch;
window.fetch=function(url,opts){
  if(typeof url==='string' && url.includes('/api/') && !url.includes('/api/auth/login')){
    const u=getUser();
    opts=opts||{}; opts.headers=opts.headers||{};
    if(u && u.token && !opts.headers['Authorization']) opts.headers['Authorization']='Bearer '+u.token;
  }
  return _f(url,opts);
};
</script>
<style>.badge.viewer{background:#e0f2fe;color:#0369a1}.badge.inspector{background:#fef3c7;color:#92400e}.badge.qc_manager{background:#dbeafe;color:#1e40af}.badge.admin{background:#0f172a;color:#fff}#roleBadge{padding:4px 10px;border-radius:20px;font-size:11px;margin-left:8px;background:#0f172a;color:#fff}</style>
</head>
<body>
<div class="header" style="height:60px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
<div><b>📊 ProjectTrack QC - Multi Sheets</b> <span style="opacity:.6;font-size:12px">Overberg WEF</span> <span id="roleBadge" style="background:rgba(255,255,255,.15);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;margin-left:8px">Loading...</span></div>
<div>
<a href="./" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px">🏠 Home</a>
<a href="./quality" style="color:#fff;text-decoration:none;background:#3b82f6;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px">🏗️ Quality Management</a>
<a href="./gantt" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px">📅 Planner</a>
<a href="./api/export/excel" style="color:#fff;text-decoration:none;background:#10b981;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px">📊 Excel</a>
<a href="#" onclick="logout()" style="color:#fff;text-decoration:none;background:#ef4444;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:8px">🚪 Logout</a>
</div>
</div>

<div class="container">
<div class="sidebar-list">
<h3>QC Sheets (Database)</h3>
<button class="btn btn-blue" style="width:100%;margin-bottom:12px" onclick="createNew()">+ New Sheet</button>
<div id="list"></div>
<div style="margin-top:16px;font-size:11px;color:#94a3b8">Stored in Railway SQLite (projecttrack.db). Unlimited sheets: Pole 12, Pole 13, Transformer, etc. Persists across browsers.</div>
</div>

<div class="main">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<h2 id="sheetTitle">Select or Create a Sheet</h2>
<div style="display:flex;gap:8px"><button class="btn btn-light" onclick="saveCurrent()">💾 Save to DB</button><button class="btn btn-light" onclick="duplicateSheet()">Duplicate</button><button class="btn btn-light" onclick="deleteSheet()" style="color:#ef4444">Delete</button></div>
</div>

<div class="meta-grid">
<div class="f"><label>Project Name</label><input id="proj"></div>
<div class="f"><label>Location / Chainage</label><input id="loc"></div>
<div class="f"><label>Date</label><input type="date" id="date"></div>
<div class="f"><label>Inspector</label><input id="ins"><label style="margin-top:8px">Status</label><select id="status"><option value="draft">Draft</option><option value="in_progress">In Progress</option><option value="passed">Passed</option><option value="failed">Failed</option></select></div>
</div>

<div id="score" style="font-size:12px;font-weight:700;margin:12px 0"></div>
<div id="sections"></div>

<div style="margin-top:20px;display:flex;gap:10px"><button class="btn btn-dark" onclick="saveCurrent()">Save to Database</button><button class="btn btn-light" onclick="window.print()">Print PDF</button></div>
</div>
</div>

<script>
const checksData = [
{title:"1. Foundation & Excavation",items:["Excavation depth 1.8m","Shuttering alignment","Reinforcement","Concrete mix & slump","Curing 7 days","Backfilling"]},
{title:"2. Pole Erection",items:["Pole type/height","Verticality ≤1°","Alignment","Bolt torque","Danger plate","Anti-climbing"]},
{title:"3. Conductor Stringing",items:["ACSR type","Sag & tension","Jumper connections","Earth continuity","Insulator cleaning","Clearance ≥2.5m"]},
{title:"4. Earthing",items:["Earth resistance <10Ω","Electrode depth 3m","GI size 25x3mm","Lightning arrester","Bonding","Pit marking"]},
{title:"5. Transformer",items:["Rating 100/200kVA","Oil level & BDV","Bushing tightness","Cable termination","Fuse/MCB","Neutral <5Ω"]},
{title:"6. Testing",items:["IR >50MΩ","Continuity","Polarity","Load test","Safety clearance","As-built docs"]},
];
let currentId = null;
let currentChecks = {};

async function api(path, method='GET', body=null){
  const opts={method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path, opts); return r.json();
}

async function loadList(){
  const sheets = await api('/api/qc-sheets');
  const el=document.getElementById('list'); el.innerHTML='';
  sheets.forEach(s=>{
    const div=document.createElement('div'); div.className='sheet-item'+(s.id===currentId?' active':'');
    div.innerHTML=`<b>${s.project_name} - ${s.location}</b><small>${s.date||''} • ${s.status} • ID ${s.id}</small>`;
    div.onclick=()=>openSheet(s.id); el.appendChild(div);
  });
}

async function openSheet(id){
  const s = await api(`/api/qc-sheets/${id}`);
  currentId=id; currentChecks=s.checks||{};
  document.getElementById('proj').value=s.project_name; document.getElementById('loc').value=s.location;
  document.getElementById('date').value=s.date||''; document.getElementById('ins').value=s.inspector;
  document.getElementById('status').value=s.status; document.getElementById('sheetTitle').innerText=`${s.project_name} - ${s.location} (ID ${s.id})`;
  renderChecks(); loadList();
}

function renderChecks(){
  const wrap=document.getElementById('sections'); wrap.innerHTML='';
  let total=0, pass=0, fail=0, checked=0;
  checksData.forEach((sec,si)=>{
    const div=document.createElement('div'); div.className='section '+(si===0?'open':'');
    let rows='';
    sec.items.forEach((it,ii)=>{
      const key=`${si}_${ii}`; const val=currentChecks[key]||{status:'',remark:''};
      total++; if(val.status){checked++; if(val.status==='pass')pass++; if(val.status==='fail')fail++;}
      rows+=`<div class="check-row"><div>${ii+1}</div><div>${it}</div><div><div class="badge ${val.status}" onclick="toggleCheck('${key}')">${val.status||'Check'}</div></div><div><input placeholder="Remark" value="${val.remark||''}" oninput="setRemark('${key}',this.value)"></div></div>`;
    });
    div.innerHTML=`<div class="section-head" onclick="this.parentElement.classList.toggle('open')"><h4>${sec.title}</h4><span>${sec.items.length}</span></div><div class="section-body">${rows}</div>`;
    wrap.appendChild(div);
  });
  document.getElementById('score').innerText=`Checked ${checked}/${total} • Pass ${pass} • Fail ${fail} • Score ${checked?Math.round(pass/checked*100):0}%`;
}

function toggleCheck(key){
  const cur=currentChecks[key]||{status:'',remark:''}; const order=['','pass','fail','na']; const next=order[(order.indexOf(cur.status)+1)%order.length];
  currentChecks[key]={...cur,status:next}; renderChecks();
}
function setRemark(key,v){ currentChecks[key]={...(currentChecks[key]||{}), remark:v, status:currentChecks[key]?.status||''}; }

async function createNew(){
  const proj=prompt('Project Name?', '132kV Overhead Line - Lot 2')||'New Project';
  const loc=prompt('Location / Pole No?', 'Pole 12 - Soweto')||'Location';
  const s=await api('/api/qc-sheets','POST',{project_name:proj, location:loc, date:new Date().toISOString().slice(0,10), inspector:'HZC QC Team', status:'draft', checks:{}});
  await loadList(); await openSheet(s.id);
}
async function saveCurrent(){
  if(!currentId){ alert('Create a sheet first'); return; }
  await api(`/api/qc-sheets/${currentId}`,'PUT',{
    project_name:document.getElementById('proj').value,
    location:document.getElementById('loc').value,
    date:document.getElementById('date').value,
    inspector:document.getElementById('ins').value,
    status:document.getElementById('status').value,
    checks:currentChecks
  });
  alert('Saved to database ID '+currentId); loadList();
}
async function duplicateSheet(){
  if(!currentId) return;
  const s=await api(`/api/qc-sheets/${currentId}`);
  const ns=await api('/api/qc-sheets','POST',{project_name:s.project_name, location:s.location+' (Copy)', date:s.date, inspector:s.inspector, status:'draft', checks:s.checks});
  loadList(); openSheet(ns.id);
}
async function deleteSheet(){
  if(!currentId) return;
  if(!confirm('Delete sheet ID '+currentId+'?')) return;
  await api(`/api/qc-sheets/${currentId}`,'DELETE'); currentId=null; document.getElementById('sections').innerHTML=''; loadList();
}
loadList();
</script>
</body>
</html>
