<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ProjectTrack Gantt - DB Shared - HZCProjects</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a;overflow:hidden}
:root{--sidebar:340px;--row:44px}
.header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:13px;margin-left:8px}
.btn{border:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;background:#fff;color:#0f172a}
.btn-primary{background:#3b82f6;color:#fff}
.main{display:flex;height:calc(100vh - 64px)}
.sidebar{width:340px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{display:grid;grid-template-columns:2fr 80px 60px;padding:12px;border-bottom:1px solid #e2e8f0;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase}
.tasks{flex:1;overflow-y:auto}
.task-row{display:grid;grid-template-columns:2fr 80px 60px;align-items:center;height:44px;padding:0 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
.task-row.active{background:#eff6ff;border-left:3px solid #3b82f6}
.dot{width:8px;height:8px;border-radius:50%}
.gantt-area{flex:1;overflow:auto;background:#fff;position:relative}
.timeline-header{height:80px;display:flex;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #e2e8f0}
.month-cell{min-width:120px;border-right:1px solid #f1f5f9;padding:8px 8px 0 8px}
.month-cell .m{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase}
.days{display:flex;margin-top:6px}.day{width:24px;text-align:center;font-size:10px;color:#94a3b8}
.gantt-rows{position:relative}
.gantt-row{height:44px;border-bottom:1px solid #f1f5f9;position:relative;display:flex;align-items:center}
.grid-lines{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;pointer-events:none}
.vline{width:24px;border-right:1px dashed #f1f5f9}
.bar{position:absolute;height:22px;border-radius:6px;display:flex;align-items:center;color:#fff;font-size:11px;font-weight:600;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar-progress{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.18);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}.modal-box{background:#fff;width:460px;border-radius:16px;padding:24px}
.field{margin-bottom:12px}.field label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px}
.kpi{display:flex;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid #e2e8f0;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1 style="font-size:18px">📊 ProjectTrack Planner - Shared DB <span id="dbBadge" style="font-size:11px;background:#10b981;padding:4px 8px;border-radius:20px;margin-left:8px">DB</span></h1>
<div><a href="./">🏠 Home</a><a href="./qc">✅ QC Check Sheets</a><a href="./api/export/excel">📊 Excel</a></div>
</div><!-- OLD HEADER REPLACED --> <div style="display:none">
<h1 style="font-size:18px">📊 ProjectTrack Planner - Shared DB <span id="dbBadge" style="font-size:11px;background:#10b981;padding:4px 8px;border-radius:20px;margin-left:8px">DB</span></h1>
<div><a href="./">🏠 Home</a><a href="./qc">✅ QC Check Sheets</a><a href="./api/export/excel">📊 Excel</a></div>
</div>
<div class="kpi" id="kpi"></div>
<div class="main">
<div class="sidebar"><div class="sidebar-head"><div>Task</div><div>Dur</div><div>Prog</div></div><div class="tasks" id="tasksList"></div></div>
<div class="gantt-area"><div class="timeline-header" id="timelineHeader"></div><div class="gantt-rows" id="ganttRows"></div></div>
</div>
<div class="modal" id="modal"><div class="modal-box">
<h3 id="modalTitle">Task</h3>
<div class="field"><label>Name</label><input id="fName"></div>
<div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Start</label><input type="date" id="fStart"></div><div><label>End</label><input type="date" id="fEnd"></div></div>
<div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Progress %</label><input type="number" id="fProgress" min="0" max="100"></div><div><label>Color</label><select id="fColor"><option value="#3b82f6">Blue</option><option value="#10b981">Green</option><option value="#f59e0b">Amber</option><option value="#ef4444">Red</option><option value="#8b5cf6">Purple</option></select></div></div>
<div class="field"><label>Owner</label><input id="fOwner"></div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="deleteTask()" id="delBtn" style="background:#fee2e2;color:#991b1b;display:none">Delete</button><button class="btn btn-primary" onclick="saveTask()">Save to DB</button></div>
</div></div>
<script>
let tasks=[]; let editingId=null; const dayMs=86400000;
const ganttStart=new Date('2026-01-01'); const ganttEnd=new Date('2026-05-15');
function daysBetween(a,b){return Math.round((b-a)/dayMs)}

async function api(path,method='GET',body=null){
  const opt={method, headers:{'Content-Type':'application/json'}};
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path,opt); return r.json();
}
async function loadTasks(){
  tasks = await api('/api/gantt-tasks');
  render();
  const st = await api('/api/status');
  document.getElementById('dbBadge').innerText=st.db + (st.use_postgres?' (Postgres)':' (SQLite)');
}
function render(){
  const list=document.getElementById('tasksList'); const rows=document.getElementById('ganttRows'); const header=document.getElementById('timelineHeader');
  list.innerHTML=''; rows.innerHTML=''; header.innerHTML='';
  const totalDays=daysBetween(ganttStart,ganttEnd);
  let cur=new Date(ganttStart);
  while(cur<ganttEnd){
    const ms=new Date(cur.getFullYear(),cur.getMonth(),1); const nm=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const dim=daysBetween(ms,nm);
    const cell=document.createElement('div'); cell.className='month-cell'; cell.style.minWidth=(dim*24)+'px';
    cell.innerHTML=`<div class="m">${cur.toLocaleDateString('en',{month:'short'})}</div><div class="days">${Array.from({length:dim},(_,i)=>`<div class="day">${i+1}</div>`).join('')}</div>`;
    header.appendChild(cell); cur=nm;
  }
  const total=tasks.length; const done=tasks.filter(t=>t.progress==100).length; const avg=total?Math.round(tasks.reduce((s,t)=>s+t.progress,0)/total):0;
  document.getElementById('kpi').innerHTML=`<div>Total: <b>${total}</b></div><div>Done: <b>${done}</b></div><div>Avg: <b>${avg}%</b></div><div>Live Shared DB - All users see same tasks</div>`;
  tasks.forEach(t=>{
    const s=new Date(t.start_date); const e=new Date(t.end_date); const dur=Math.max(1,daysBetween(s,e));
    const tr=document.createElement('div'); tr.className='task-row'+(editingId===t.id?' active':''); tr.onclick=()=>openModal(t.id);
    tr.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><span class="dot" style="background:${t.color}"></span>${t.name}</div><div>${dur}d</div><div>${t.progress}%</div>`;
    list.appendChild(tr);
    const gRow=document.createElement('div'); gRow.className='gantt-row';
    const grid=document.createElement('div'); grid.className='grid-lines';
    for(let i=0;i<totalDays;i++){ const v=document.createElement('div'); v.className='vline'; grid.appendChild(v) }
    gRow.appendChild(grid);
    const offset=Math.max(0,daysBetween(ganttStart,s));
    const bar=document.createElement('div'); bar.className='bar'; bar.style.left=(offset*24+8)+'px'; bar.style.width=(dur*24-16)+'px'; bar.style.background=t.color;
    bar.innerHTML=`<div class="bar-progress" style="width:${t.progress}%"></div><span style="position:relative">${t.name}</span>`;
    gRow.appendChild(bar); rows.appendChild(gRow);
  });
}
function openModal(id=null){
  document.getElementById('modal').classList.add('open');
  if(id){
    const t=tasks.find(x=>x.id===id); editingId=id;
    document.getElementById('modalTitle').innerText='Edit Task - ID '+id;
    document.getElementById('fName').value=t.name; document.getElementById('fStart').value=t.start_date; document.getElementById('fEnd').value=t.end_date;
    document.getElementById('fProgress').value=t.progress; document.getElementById('fColor').value=t.color; document.getElementById('fOwner').value=t.owner;
    document.getElementById('delBtn').style.display='block';
  } else {
    editingId=null; document.getElementById('modalTitle').innerText='New Task (Shared DB)';
    document.getElementById('fName').value=''; document.getElementById('fStart').valueAsDate=new Date(); document.getElementById('fEnd').valueAsDate=new Date(Date.now()+7*dayMs);
    document.getElementById('fProgress').value=0; document.getElementById('fColor').value='#3b82f6'; document.getElementById('fOwner').value='HZC Team';
    document.getElementById('delBtn').style.display='none';
  }
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveTask(){
  const payload={name:document.getElementById('fName').value, start:document.getElementById('fStart').value, end:document.getElementById('fEnd').value, progress:parseInt(document.getElementById('fProgress').value)||0, color:document.getElementById('fColor').value, owner:document.getElementById('fOwner').value};
  if(!payload.name||!payload.start||!payload.end) return alert('Fill fields');
  if(editingId) await api(`/api/gantt-tasks/${editingId}`,'PUT',payload);
  else await api('/api/gantt-tasks','POST',payload);
  closeModal(); loadTasks();
}
async function deleteTask(){
  if(!editingId) return;
  if(!confirm('Delete task ID '+editingId+'?')) return;
  await api(`/api/gantt-tasks/${editingId}`,'DELETE'); closeModal(); loadTasks();
}
loadTasks();
</script>
</body>
</html>
