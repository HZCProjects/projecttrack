<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HZC Projects - ProjectTrack Login</title>
<link rel="stylesheet" href="projecttrack.css"/>
</head>
<body>
<div class="topbar">
  <div class="brand">HZC PROJECTS <small>ProjectTrack</small></div>
  <div class="kv"><span id="dbStatus">checking db...</span></div>
</div>
<div class="container">
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="signin">Sign In</button>
      <button class="tab" data-tab="create">Create Account</button>
      <button class="tab" data-tab="users">Users DB</button>
    </div>

    <div id="panel-signin">
      <div class="form">
        <input class="input" id="loginEmail" placeholder="Email" type="email"/>
        <input class="input" id="loginPassword" placeholder="Password" type="password"/>
        <button class="btn" id="btnLogin">Sign In</button>
        <div id="loginMsg"></div>
        <div class="kv">Default: root@hzcprojects.com / root123 | admin@hzcprojects.com / admin123 | viewer@hzcprojects.com / viewer123</div>
      </div>
    </div>

    <div id="panel-create" style="display:none">
      <div class="form">
        <div class="grid">
          <input class="input" id="regName" placeholder="Full Name"/>
          <select class="select" id="regRole">
            <option value="viewer">Viewer</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="grid">
          <input class="input" id="regEmail" placeholder="Email" type="email"/>
          <input class="input" id="regPassword" placeholder="Password" type="password"/>
        </div>
        <button class="btn" id="btnRegister">Create Account</button>
        <div id="regMsg"></div>
      </div>
    </div>

    <div id="panel-users" style="display:none">
      <div class="row">
        <button class="btn secondary" id="btnRefreshUsers">Refresh Users</button>
        <button class="btn secondary" id="btnHealth">Check /health</button>
      </div>
      <div id="usersMsg" style="margin-top:12px"></div>
      <div id="usersList" class="users"></div>
    </div>

  </div>
</div>
<script>
const $ = s => document.querySelector(s);
function showMsg(el, text, ok){
  el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`;
}
function tabSwitch(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  $('#panel-signin').style.display = name==='signin' ? '' : 'none';
  $('#panel-create').style.display = name==='create' ? '' : 'none';
  $('#panel-users').style.display = name==='users' ? '' : 'none';
  if(name==='users') loadUsers();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>tabSwitch(t.dataset.tab)));

async function checkHealth(){
  try{
    const r = await fetch('/health');
    const j = await r.json();
    $('#dbStatus').textContent = `DB: ${j.db} | Users: ${j.users} | ${j.database_url_present ? 'Postgres env present' : 'SQLite fallback'}`;
  }catch(e){ $('#dbStatus').textContent='DB check failed'; }
}
checkHealth();

async function login(){
  const email=$('#loginEmail').value.trim();
  const password=$('#loginPassword').value;
  if(!email||!password){ showMsg($('#loginMsg'),'Enter email and password',false); return; }
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){ showMsg($('#loginMsg'), data.error||'Login failed', false); return; }
    localStorage.setItem('pt_token', data.token);
    localStorage.setItem('pt_user', JSON.stringify(data.user));
    showMsg($('#loginMsg'),'Login ok, redirecting...', true);
    setTimeout(()=>location.href='/index.html', 600);
  }catch(e){ showMsg($('#loginMsg'),'Network error', false); }
}
async function registerUser(){
  const name=$('#regName').value.trim();
  const email=$('#regEmail').value.trim();
  const password=$('#regPassword').value;
  const role=$('#regRole').value;
  if(!name||!email||!password){ showMsg($('#regMsg'),'All fields required', false); return; }
  try{
    const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role})});
    const data=await res.json();
    if(!res.ok){ showMsg($('#regMsg'), data.error||'Create failed', false); return; }
    showMsg($('#regMsg'), `Created ${data.user.email} as ${data.user.role}`, true);
    $('#regName').value=''; $('#regEmail').value=''; $('#regPassword').value='';
  }catch(e){ showMsg($('#regMsg'),'Network error', false); }
}
async function loadUsers(){
  const msg=$('#usersMsg'); const list=$('#usersList');
  msg.innerHTML=''; list.innerHTML='<div class="kv">Loading...</div>';
  try{
    const r=await fetch('/api/users');
    const users=await r.json();
    if(!Array.isArray(users)){ list.innerHTML=''; showMsg(msg,'Failed to load', false); return; }
    list.innerHTML='';
    users.forEach(u=>{
      const div=document.createElement('div');
      div.className='user-row';
      div.innerHTML=`<div><div class="kv"><strong>${u.name}</strong> - ${u.email}</div><div class="kv">Role: ${u.role} | Created: ${new Date(u.created_at).toLocaleString()} ${u.last_login? '| Last: '+new Date(u.last_login).toLocaleString():''}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="badge">${u.role}</span><button class="btn danger" data-id="${u.id}">Delete</button></div>`;
      list.appendChild(div);
    });
    list.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', async()=>{
        const token=localStorage.getItem('pt_token');
        if(!token){ showMsg(msg,'Login as admin/ROOT first to delete', false); return; }
        if(!confirm('Delete this user?')) return;
        const res=await fetch(`/api/users/${btn.dataset.id}`,{method:'DELETE', headers:{'Authorization':`Bearer ${token}`}});
        const d=await res.json();
        if(!res.ok){ showMsg(msg,d.error||'Delete failed', false); return; }
        showMsg(msg,'Deleted', true); loadUsers();
      });
    });
    if(users.length===0) showMsg(msg,'No users yet', false);
    else showMsg(msg, `${users.length} users from real DB`, true);
  }catch(e){ list.innerHTML=''; showMsg(msg,'Network error', false); }
}
async function healthBtn(){
  try{
    const r=await fetch('/health'); const j=await r.json();
    showMsg($('#usersMsg'), JSON.stringify(j,null,2), true);
  }catch(e){ showMsg($('#usersMsg'),'Health failed', false); }
}
$('#btnLogin').addEventListener('click', login);
$('#btnRegister').addEventListener('click', registerUser);
$('#btnRefreshUsers').addEventListener('click', loadUsers);
$('#btnHealth').addEventListener('click', healthBtn);
document.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const active=document.querySelector('.tab.active')?.dataset.tab; if(active==='signin') login(); if(active==='create') registerUser(); }});
</script>
</body>
</html>
