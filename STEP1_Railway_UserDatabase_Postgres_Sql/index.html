<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HZC Projects - ProjectTrack</title>
<link rel="stylesheet" href="projecttrack.css"/>
</head>
<body>
<div class="topbar">
  <div class="brand">HZC PROJECTS <small>ProjectTrack Dashboard</small></div>
  <div style="display:flex;gap:8px">
    <button class="btn secondary" id="btnGoLogin">Login Page</button>
    <button class="btn" id="btnLogout">Logout</button>
  </div>
</div>
<div class="container">
  <div class="dashboard-header">
    <div>
      <h2 id="welcome" style="color:var(--text-strong)">Welcome</h2>
      <div class="kv" id="userInfo"></div>
    </div>
    <div class="kv" id="dbInfo"></div>
  </div>
  <div class="stat">
    <div><div class="kv">DB Type</div><strong id="statDb">-</strong></div>
    <div><div class="kv">Total Users</div><strong id="statUsers">-</strong></div>
    <div><div class="kv">Your Role</div><strong id="statRole">-</strong></div>
  </div>
  <div class="card">
    <h3 style="color:var(--text-strong);margin-bottom:12px">ProjectTrack Status</h3>
    <div class="kv">This dashboard checks token from localStorage. If no token, redirects to login. Logout calls /api/auth/logout.</div>
    <div style="margin-top:14px" id="dashMsg"></div>
  </div>
</div>
<script>
function getToken(){ return localStorage.getItem('pt_token'); }
function getUser(){ try{ return JSON.parse(localStorage.getItem('pt_user')||'null'); }catch{ return null; } }

async function init(){
  const token=getToken();
  const user=getUser();
  if(!token || !user){
    location.href='/login.html';
    return;
  }
  document.getElementById('welcome').textContent=`Welcome, ${user.name}`;
  document.getElementById('userInfo').textContent=`${user.email} - Role: ${user.role}`;
  document.getElementById('statRole').textContent=user.role;
  try{
    const r=await fetch('/health');
    const j=await r.json();
    document.getElementById('statDb').textContent=j.db;
    document.getElementById('statUsers').textContent=j.users;
    document.getElementById('dbInfo').textContent=`DB: ${j.db} | Postgres env: ${j.database_url_present ? 'yes' : 'no (SQLite)'}`;
    document.getElementById('dashMsg').innerHTML=`<div class="msg ok">Connected to ${j.db} - ${j.users} users in DB. Railway build green.</div>`;
  }catch(e){
    document.getElementById('dashMsg').innerHTML=`<div class="msg err">Health check failed</div>`;
  }
}
document.getElementById('btnLogout').addEventListener('click', async()=>{
  const token=getToken();
  try{ await fetch('/api/auth/logout',{method:'POST', headers:{'Authorization':`Bearer ${token}`}}); }catch{}
  localStorage.removeItem('pt_token'); localStorage.removeItem('pt_user');
  location.href='/login.html';
});
document.getElementById('btnGoLogin').addEventListener('click', ()=>location.href='/login.html');
init();
</script>
</body>
</html>
